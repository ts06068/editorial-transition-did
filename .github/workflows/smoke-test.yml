name: smoke-test

on:
  push:
  pull_request:

permissions:
  # The workflow only needs to read the checked-out repository.
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Run tests
        run: python -m pytest
      - name: Run sample analysis
        # Exercise the installed CLI end to end without private study data or MSSQL.
        run: editorial-transition-did --mode sample
