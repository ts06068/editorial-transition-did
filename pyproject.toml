[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "editorial-transition-did"
version = "0.1.0"
description = "Difference-in-differences analysis of citation impact after the 2024 JACC editorial transition."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "matplotlib==3.11.1",
  "numpy==2.5.1",
  "openpyxl==3.1.5",
  "pandas==3.0.3",
  "pymssql==2.3.13",
  "python-docx==1.2.0",
  "python-dotenv==1.2.2",
  "scikit-learn==1.9.0",
  "scipy==1.18.0",
  "statsmodels==0.14.6",
  "tqdm==4.68.3",
  "xlsxwriter==3.2.9",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "ruff==0.9.10",
]

[project.scripts]
editorial-transition-did = "editorial_transition_did.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/editorial_transition_did"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
